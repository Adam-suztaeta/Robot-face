<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff88;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ROBOT */

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 25px #00ff8855;
    transition:0.3s;
}

#face{
    width:150px;
    height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

/* OJOS CUADRADOS */

.eyes{
    display:flex;
    gap:30px;
}

.eye{
    width:35px;
    height:35px;
    background:#00ff88;
    transition:0.2s;
}

/* BOCA MÁS CERCA */

.mouth{
    width:60px;
    height:12px;
    background:#00ff88;
    margin-top:-5px;
    transition:0.2s;
}

/* PARPADEO */

.blink{
    animation:blinkAnim 0.15s;
}

@keyframes blinkAnim{
    0%{height:35px;}
    50%{height:5px;}
    100%{height:35px;}
}

/* MODO SUSTO */

.susto{
    background:#002b00 !important;
    box-shadow:0 0 25px #00ff00 !important;
}

.cross{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
    color:black;
}
</style>
</head>
<body>

<div id="robot">
    <div id="face">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Ingrese comando exacto...">
</div>

<script>

let usedCommands = JSON.parse(localStorage.getItem("chillbillUsed")) || {};
let saturnUnlocked = false;
let saturnPasswordStage = false;

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const robot = document.getElementById("robot");
const eyes = document.querySelectorAll(".eye");

function saveUsed(){
    localStorage.setItem("chillbillUsed", JSON.stringify(usedCommands));
}

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

/* PARPADEO AUTOMÁTICO */

function blink(){
    eyes.forEach(e => e.classList.add("blink"));
    setTimeout(()=>{
        eyes.forEach(e => e.classList.remove("blink"));
    },150);
}

setInterval(blink, 4000);

/* MODO SUSTO TEMPORAL */

function activateSusto(){
    robot.classList.add("susto");

    eyes.forEach(e=>{
        e.textContent = "X";
        e.classList.add("cross");
    });

    setTimeout(()=>{
        robot.classList.remove("susto");
        eyes.forEach(e=>{
            e.textContent = "";
            e.classList.remove("cross");
        });
    },2000);
}

/* MENSAJE DE BIENVENIDA */

addMessage("Hola, bienvenidos. Soy chill-bill Antivirus.", "chill-bill");
addMessage("Sistema activo.", "chill-bill");
addMessage("Comandos disponibles:", "chill-bill");
addMessage("Hola | Personal | Entertainment | creadores", "chill-bill");

function respond(text){

    /* DETECCIÓN SUSTO */
    if(text === "Susto" || text === "susto" || text === "SUSTO"){
        activateSusto();
    }

    if(usedCommands[text]) return null;

    switch(text){

        case "Hola":
            usedCommands[text] = true;
            saveUsed();
            return "Saludo detectado. Protección activa.";

        case "Personal":
            usedCommands[text] = true;
            saveUsed();
            return "Archivo Personal:\nVacía Entertainment\nTrabajadores: ██████\nContacto: ██████";

        case "Entertainment":
            usedCommands[text] = true;
            saveUsed();
            return "Vacía Entertainment existe.\nEstado legal: Activo.\nNúmero: ██████";

        case "creadores":
            usedCommands[text] = true;
            saveUsed();
            return "Los creadores de Vacía Studios son:\nA.5U5TO\nL.bill";

        case "Project Saturn Archive_14.7_update":
            saturnPasswordStage = true;
            return "Archivo detectado.\nIngrese contraseña.";

        default:
            if(saturnPasswordStage && text === "AdamandLily"){
                saturnUnlocked = true;
                saturnPasswordStage = false;

                let btn = document.createElement("button");
                btn.textContent = "Acceder al Archivo Saturn";
                btn.onclick = function(){
                    window.location.href = "archivo_saturn.html"; 
                };
                document.getElementById("chat").appendChild(btn);

                return "Contraseña correcta.\nArchivo desbloqueado.";
            }

            return null;
    }
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Usuario");
        let reply = respond(text);

        if(reply){
            addMessage(reply,"chill-bill");
        }

        input.value="";
    }
});

</script>

</body>
</html>
