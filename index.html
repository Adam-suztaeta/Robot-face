<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff00;
    font-family: "Courier New", monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TERMINAL ESTILO CMD */

#chat{
    width:80%;
    max-width:800px;
    background:black;
    border:2px solid #00ff00;
    padding:20px;
    margin-top:40px;
    box-shadow:0 0 20px #00ff0055;
}

#messages{
    min-height:300px;
    white-space:pre-wrap;
}

#input{
    width:100%;
    background:black;
    border:none;
    color:#00ff00;
    font-family:"Courier New", monospace;
    font-size:16px;
    outline:none;
}

/* ROBOT */

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 20px #00ff0055;
    transition:0.3s;
}

#face{
    width:150px;
    height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.eyes{
    display:flex;
    gap:30px;
}

.eye{
    width:35px;
    height:35px;
    background:#00ff00;
}

.mouth{
    width:60px;
    height:12px;
    background:#00ff00;
    margin-top:-10px;
}

/* SUSTO */

.susto{
    background:#002b00 !important;
    box-shadow:0 0 30px #00ff00 !important;
}

.cross{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
    color:black;
}
</style>
</head>
<body>

<div id="robot">
    <div id="face">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="C:\>">
</div>

<script>

let usedCommands = JSON.parse(localStorage.getItem("chillbillUsed")) || {};
let saturnPasswordStage = false;

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const robot = document.getElementById("robot");
const eyes = document.querySelectorAll(".eye");

function addMessage(text){
    messages.innerHTML += text + "\n";
    messages.scrollTop = messages.scrollHeight;
}

/* PRESENTACIÓN LARGA */

addMessage("chill-bill Antivirus v1.9.7");
addMessage("Inicializando sistema...");
addMessage("Cargando protocolos de seguridad...");
addMessage("Acceso monitoreado.");
addMessage("");
addMessage("Soy un antivirus especial.");
addMessage("Creado por ███████.");
addMessage("Propiedad de I VACIA Studios.");
addMessage("");
addMessage("Comandos disponibles:");
addMessage("Hola");
addMessage("Personal");
addMessage("Entertainment");
addMessage("Creadores");
addMessage("");

/* MODO SUSTO */

function activateSusto(){
    robot.classList.add("susto");
    eyes.forEach(e=>{
        e.textContent="X";
        e.classList.add("cross");
    });
    setTimeout(()=>{
        robot.classList.remove("susto");
        eyes.forEach(e=>{
            e.textContent="";
            e.classList.remove("cross");
        });
    },2000);
}

function respond(text){

    let lower = text.toLowerCase();

    /* SUSTO */
    if(lower === "susto"){
        activateSusto();
        return;
    }

    /* BLOQUEO SI SOLO PONEN SATURN */
    if(lower.includes("saturn") && text !== "Project Saturn Archive_14.7_update"){
        return "Acceso denegado.";
    }

    /* ACTIVADOR REAL */
    if(text === "Project Saturn Archive_14.7_update"){
        saturnPasswordStage = true;
        return "Archivo detectado.\nIngrese contraseña.";
    }

    /* CONTRASEÑA */
    if(saturnPasswordStage && lower === "adamandlily"){
        saturnPasswordStage = false;

        let btn = document.createElement("button");
        btn.textContent = "Acceder al Archivo Saturn";
        btn.style.background="black";
        btn.style.color="#00ff00";
        btn.style.border="1px solid #00ff00";
        btn.style.marginTop="10px";
        btn.onclick=function(){
            window.location.href="archivo_saturn.html";
        };
        document.getElementById("chat").appendChild(btn);

        return "Contraseña correcta.\nArchivo desbloqueado.";
    }

    switch(lower){

        case "hola":
            return "Saludo detectado. Proteccion activa.";

        case "personal":
            return "Archivo Personal:\nVACIA Entertainment\nTrabajadores: ██████";

        case "entertainment":
            return "VACIA Entertainment existe.\nEstado legal: Activo.";

        case "creadores":
            return "Creadores registrados:\nA.5U5TO\nL.bill";

        default:
            return "Comando no reconocido.";
    }
}

input.addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        let text=input.value.trim();
        if(!text) return;

        addMessage("C:\\> " + text);
        let reply=respond(text);
        if(reply) addMessage(reply);

        input.value="";
    }
});

</script>

</body>
</html>
