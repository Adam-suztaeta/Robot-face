<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Robot OS</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#000;
    height:100%;
    overflow:hidden;
    touch-action:none;
}

#robot{
    width:100vw;
    height:100vh;
    position:relative;
    transition:transform 0.2s ease;
}

.eye{
    width:22vw;
    height:22vw;
    background:#111;
    border:0.6vw solid #00ffff;
    position:absolute;
    top:30vh;
    overflow:hidden;
}

#leftEye{ left:18vw; }
#rightEye{ right:18vw; }

.pupil{
    width:7vw;
    height:7vw;
    background:#00ffff;
    position:absolute;
    top:7vw;
    left:7vw;
    transition:transform 0.15s ease;
}

#mouth{
    width:30vw;
    height:4vw;
    border:0.6vw solid #00ffff;
    border-top:none;
    position:absolute;
    bottom:25vh;
    left:50%;
    transform:translateX(-50%);
    transition:all 0.3s ease;
}

.closed{
    height:2vw !important;
}

.sleep{
    opacity:0.4;
}
</style>
</head>
<body>

<div id="robot">
    <div class="eye" id="leftEye">
        <div class="pupil" id="leftPupil"></div>
    </div>
    <div class="eye" id="rightEye">
        <div class="pupil" id="rightPupil"></div>
    </div>
    <div id="mouth"></div>
</div>

<script>
const robot = document.getElementById("robot");
const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const leftPupil = document.getElementById("leftPupil");
const rightPupil = document.getElementById("rightPupil");
const mouth = document.getElementById("mouth");

let inactiveTimer;
let sleeping=false;
let interacting=false;

/* ---------- FULLSCREEN ---------- */
function goFull(){
    if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen();
    }
}
document.addEventListener("touchstart",goFull,{once:true});

/* ---------- MOVIMIENTO OJOS ---------- */
function moveEyes(x,y){
    leftPupil.style.transform=`translate(${x}px,${y}px)`;
    rightPupil.style.transform=`translate(${x}px,${y}px)`;
}

/* ---------- ANIMACIONES IDLE ---------- */
function idleLook(){
    if(interacting || sleeping) return;
    let x=(Math.random()*80)-40;
    let y=(Math.random()*80)-40;
    moveEyes(x,y);
}
setInterval(idleLook,2500);

function idleSmile(){
    if(interacting || sleeping) return;
    mouth.style.height="8vw";
    setTimeout(()=>mouth.style.height="4vw",1200);
}
setInterval(idleSmile,7000);

/* ---------- INTERACCIÓN DEDO ---------- */
document.addEventListener("touchmove",e=>{
    wakeUp();
    interacting=true;
    const t=e.touches[0];
    const rect=robot.getBoundingClientRect();
    let x=((t.clientX-rect.width/2)/rect.width)*120;
    let y=((t.clientY-rect.height/2)/rect.height)*120;
    moveEyes(x,y);
    mouth.style.height="8vw";
});

document.addEventListener("touchend",()=>{
    interacting=false;
    mouth.style.height="4vw";
});

/* ---------- CIERRE OJOS ---------- */
leftEye.addEventListener("touchstart",()=>{
    wakeUp();
    leftEye.classList.toggle("closed");
});
rightEye.addEventListener("touchstart",()=>{
    wakeUp();
    rightEye.classList.toggle("closed");
});

/* ---------- SUEÑO ---------- */
function sleepMode(){
    sleeping=true;
    robot.classList.add("sleep");
    leftEye.classList.add("closed");
    rightEye.classList.add("closed");
}
function wakeUp(){
    sleeping=false;
    robot.classList.remove("sleep");
    leftEye.classList.remove("closed");
    rightEye.classList.remove("closed");
    resetTimer();
}
function resetTimer(){
    clearTimeout(inactiveTimer);
    inactiveTimer=setTimeout(sleepMode,25000);
}
resetTimer();

/* ---------- GIROSCOPIO FUERTE ---------- */
if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientation",e=>{
        if(sleeping) return;
        let tiltX=e.gamma;
        let tiltY=e.beta;
        robot.style.transform=`rotate(${tiltX/3}deg) translateY(${tiltY/5}px)`;
    });
}

/* ---------- REACCIÓN A AGITAR ---------- */
if(window.DeviceMotionEvent){
    window.addEventListener("devicemotion",e=>{
        if(sleeping) return;
        let a=e.accelerationIncludingGravity;
        let total=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
        if(total>45){
            mouth.style.height="2vw";
            setTimeout(()=>mouth.style.height="4vw",400);
        }
    });
}

/* ---------- REACCIÓN A SONIDO ---------- */
navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const ctx=new AudioContext();
    const mic=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    mic.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);

    function detect(){
        analyser.getByteFrequencyData(data);
        let volume=data.reduce((a,b)=>a+b)/data.length;
        if(volume>60 && !sleeping){
            mouth.style.height="10vw";
            moveEyes((Math.random()*100)-50,(Math.random()*100)-50);
        }
        requestAnimationFrame(detect);
    }
    detect();
});
</script>
</body>
</html>
