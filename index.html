<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00aaff;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#container{
    width:95%;
    max-width:900px;
}

#robot{
    margin:20px auto;
    width:180px;
    height:180px;
    background:#001a2e;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 25px #00aaff55;
    transition:0.3s;
}

.eyes{
    font-size:30px;
}

.mouth{
    font-size:26px;
}

#chat{
    width:100%;
}

#messages{
    height:260px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:black;
    border:1px solid #00aaff;
    color:#00aaff;
    font-family:monospace;
}

button{
    margin-top:10px;
    padding:8px;
    background:#00aaff;
    border:none;
    cursor:pointer;
}

.greenMode{
    background:#001a00 !important;
    color:#00ff00 !important;
}

.greenMode #robot{
    background:#002b00 !important;
    box-shadow:0 0 25px #00ff00 !important;
}

@media (orientation: landscape) and (max-height:500px){
    #messages{
        height:150px;
    }
}
</style>
</head>
<body>

<div id="container">

<div id="robot">
    <div class="eyes" id="eyes">◉ ◉</div>
    <div class="mouth" id="mouth">‿</div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Use /comando">
</div>

</div>

<script>

let saturnPasswordStage = false;
let attempts = 3;
let locked = false;

const body = document.body;
const eyes = document.getElementById("eyes");
const mouth = document.getElementById("mouth");
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

/* BIENVENIDA */

addMessage("Hola, bienvenidos. Soy chill-bill Antivirus.", "chill-bill");
addMessage("Sistema activo.", "chill-bill");
addMessage("Comandos: /hola /personal /entertainment /creadores /creadores_adam /creadores_lily /derechos /saturn", "chill-bill");

function activateSusto(){
    body.classList.add("greenMode");
    eyes.textContent = "X X";
    mouth.textContent = "w";
}

function respond(text){

    if(locked) return null;

    if(!text.startsWith("/")) return null;

    let cmd = text.trim();

    /* SUSTO */
    if(cmd === "/asusto"){
        activateSusto();
        return null;
    }

    /* SATURN VARIACIONES */
    if(cmd.toLowerCase() === "/project saturn"){
        return "Incorrect name.";
    }

    if(cmd.toLowerCase().startsWith("/saturn")){
        return "Ruta encontrada:\n/saturn/archive\n/saturn/logs\n/saturn/system";
    }

    /* DESBLOQUEO REAL */
    if(cmd === "/Project Saturn Archive_14.7_update"){
        saturnPasswordStage = true;
        attempts = 3;
        return "Enter password.";
    }

    if(saturnPasswordStage){
        if(cmd.substring(1) === "AdamXLily"){
            saturnPasswordStage = false;

            let btn = document.createElement("button");
            btn.textContent = "Acceder Archivo Saturn";
            btn.onclick = function(){
                window.location.href = "archivo_saturn.html";
            };
            document.getElementById("chat").appendChild(btn);

            return "Access granted.";
        }else{
            attempts--;
            if(attempts <= 0){
                locked = true;
                return "System locked.";
            }
            return "Wrong password. Attempts left: " + attempts;
        }
    }

    /* COMANDOS NORMALES */

    switch(cmd){

        case "/hola":
            return "Saludo detectado.";

        case "/personal":
            return "Archivo Personal:\nVasi Entertainment\nTrabajadores: ██████";

        case "/entertainment":
            return "Vasi Entertainment\nEstado: Activo";

        case "/derechos":
            return "© Todos los derechos reservados.\nVasi Entertainment.";

        case "/creadores":
            return "Use /creadores_adam o /creadores_lily";

        case "/creadores_adam":
            return "Adam █████ es un hombre normal.\nCo-creador de Vasi Studio y █████ Project Saturn.\nProgramador principal junto a █████ (Lily).";

        case "/creadores_lily":
            return "Lili █████.\nCo-creadora de Vasi Entertainment.\nParticipante en █████ Project Saturn.\nCara principal y creadora del sistema Chill_bil.";

        default:
            return "error";
    }
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Usuario");
        let reply = respond(text);

        if(reply){
            addMessage(reply,"chill-bill");
        }

        input.value="";
    }
});

</script>

</body>
</html>
