<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff88;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 25px #00ff8855;
    position:relative;
}

#face{
    width:150px;
    height:150px;
    background:#1a1a1a;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:20px;
    position:relative;
}

/* OJOS CUBO */
.eye{
    width:40px;
    height:40px;
    background:#00ff88;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pupil{
    width:15px;
    height:15px;
    background:black;
}

/* BOCA CUBO */
.mouth{
    width:60px;
    height:15px;
    background:#00ff88;
    margin-top:20px;
}

/* PARPADEO */
.blink{
    animation:blinkAnim 0.2s;
}

@keyframes blinkAnim{
    0%{height:40px;}
    50%{height:5px;}
    100%{height:40px;}
}

/* MODO SUSTO */
.green{
    background:#002b00 !important;
    box-shadow:0 0 25px #00ff00 !important;
}

.cross{
    background:#00ff00 !important;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
    color:black;
}

#chat{
    width:90%;
    max-width:600px;
    margin-top:30px;
}

#messages{
    height:260px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    font-family:monospace;
}

button{
    margin-top:10px;
    padding:8px;
    background:#00ff88;
    border:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="robot">
    <div id="face">
        <div class="eye left">
            <div class="pupil"></div>
        </div>
        <div class="eye right">
            <div class="pupil"></div>
        </div>
        <div class="mouth"></div>
    </div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Ingrese comando exacto...">
</div>

<script>

let usedCommands = JSON.parse(localStorage.getItem("chillbillUsed")) || {};
let saturnUnlocked = false;
let saturnPasswordStage = false;

const messages = document.getElementById("messages");
const input = document.getElementById("input");

function saveUsed(){
    localStorage.setItem("chillbillUsed", JSON.stringify(usedCommands));
}

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

    /* === PARPADEO AUTOMÁTICO === */

const eyes = document.querySelectorAll(".eye");
const robot = document.getElementById("robot");

function blink(){
    eyes.forEach(e => e.classList.add("blink"));
    setTimeout(()=>{
        eyes.forEach(e => e.classList.remove("blink"));
    },200);
}

setInterval(blink, 4000);

/* === DETECTOR SUSTO === */

function checkSusto(text){
    if(text === "Susto" || text === "susto" || text === "SUSTO"){
        activateSustoMode();
    }
}

function activateSustoMode(){
    robot.classList.add("green");

    eyes.forEach(e=>{
        e.innerHTML = "X";
        e.classList.add("cross");
    });
}

/* Interceptamos el input sin romper tu sistema */

const originalRespond = respond;

respond = function(text){
    checkSusto(text);
    return originalRespond(text);
};

/* MENSAJE DE BIENVENIDA */

addMessage("Hola, bienvenidos. Soy chill-bill Antivirus.", "chill-bill");
addMessage("Sistema activo.", "chill-bill");
addMessage("Comandos disponibles:", "chill-bill");
addMessage("Hola | Personal | Entertainment | creadores", "chill-bill");

function respond(text){

    if(usedCommands[text]) return null;

    switch(text){

        case "Hola":
            usedCommands[text] = true;
            saveUsed();
            return "Saludo detectado. Protección activa.";

        case "Personal":
            usedCommands[text] = true;
            saveUsed();
            return "Archivo Personal:\nVacía Entertainment\nTrabajadores: ██████\nContacto: ██████";

        case "Entertainment":
            usedCommands[text] = true;
            saveUsed();
            return "Vacía Entertainment existe.\nEstado legal: Activo.\nNúmero: ██████";

        case "creadores":
            usedCommands[text] = true;
            saveUsed();
            return "Los creadores de Vacía Studios son:\nA.5U5TO\nL.bill";

        case "Project Saturn Archive_14.7_update":
            saturnPasswordStage = true;
            return "Archivo detectado.\nIngrese contraseña.";

        default:
            if(saturnPasswordStage && text === "AdamandLily"){
                saturnUnlocked = true;
                saturnPasswordStage = false;

                let btn = document.createElement("button");
                btn.textContent = "Acceder al Archivo Saturn";
                btn.onclick = function(){
                    window.location.href = "archivo_saturn.html"; 
                    /* CAMBIÁ ESTA RUTA DESPUÉS */
                };
                document.getElementById("chat").appendChild(btn);

                return "Contraseña correcta.\nArchivo desbloqueado.";
            }

            return null;
    }
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Usuario");
        let reply = respond(text);

        if(reply){
            addMessage(reply,"chill-bill");
        }

        input.value="";
    }
});

</script>

</body>
</html>
