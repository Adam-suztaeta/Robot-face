<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VacIA</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ROBOT */

#robot{
    margin-top:60px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:0.5s;
    box-shadow:0 0 20px #0ff33f44;
}

.eyes{
    display:flex;
    gap:30px;
}

.eye{
    width:30px;
    height:30px;
    background:#00ff88;
    border-radius:50%;
    transition:0.5s;
}

.mouth{
    margin-top:25px;
    width:80px;
    height:20px;
    background:#00ff88;
    border-radius:20px;
    transition:0.5s;
}

/* ESTADOS */

.happy .mouth{
    height:30px;
    border-radius:0 0 40px 40px;
}

.angry .eye{
    background:red;
    transform:scale(0.8);
}

.angry .mouth{
    background:red;
    height:10px;
}

.sad .eye{
    background:#555;
}

.sad .mouth{
    background:#555;
    height:5px;
}

.glitch{
    animation:glitch 0.2s infinite;
}

@keyframes glitch{
    0%{transform:translate(2px,-2px);}
    50%{transform:translate(-2px,2px);}
    100%{transform:translate(0);}
}

/* CHAT */

#chat{
    margin-top:40px;
    width:90%;
    max-width:500px;
}

#messages{
    height:200px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#000;
    border:1px solid #00ff88;
    color:white;
}
</style>
</head>
<body>

<div id="robot" class="happy">
    <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>
    <div class="mouth"></div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Escribe algo...">
</div>

<script>

/* ===== MEMORIA ===== */

let memory = JSON.parse(localStorage.getItem("vaciaMemory")) || {
    trust:50,
    hostility:0,
    sadness:0,
    curiosity:0,
    interactions:0,
    projectUnlocked:false
};

function saveMemory(){
    localStorage.setItem("vaciaMemory", JSON.stringify(memory));
}

/* ===== ELEMENTOS ===== */

const robot = document.getElementById("robot");
const messages = document.getElementById("messages");
const input = document.getElementById("input");

/* ===== FUNCIONES ===== */

function updateFace(){

    robot.classList.remove("happy","angry","sad","glitch");

    if(memory.hostility > 70){
        robot.classList.add("angry","glitch");
    }
    else if(memory.sadness > 60){
        robot.classList.add("sad");
    }
    else if(memory.trust > 60){
        robot.classList.add("happy");
    }
    else{
        robot.classList.add("sad");
    }
}

function respond(text){

    memory.interactions++;

    let lower = text.toLowerCase();

    /* SISTEMA DE APRENDIZAJE */

    if(lower.includes("hola")){
        memory.trust += 5;
    }

    if(lower.includes("gracias")){
        memory.trust += 4;
    }

    if(lower.includes("odio") || lower.includes("estúpido")){
        memory.hostility += 10;
        memory.trust -= 5;
    }

    if(lower.includes("?")){
        memory.curiosity += 3;
    }

    if(lower.length < 3){
        memory.sadness += 5;
    }

    /* DESBLOQUEO SECRETO */

    if(text === "Project Saturn Archive_14.7_update"){
        memory.projectUnlocked = true;
        saveMemory();
        return "🪐 Project SaturN Archive desbloqueado.\nAcceso concedido.";
    }

    if(lower.includes("project saturn") && !memory.projectUnlocked){
        return "...No existe ningún Project Saturn.";
    }

    /* RESPUESTAS DINÁMICAS */

    let response = "";

    if(memory.hostility > 70){
        response = "No me gusta cómo me hablas.";
    }
    else if(memory.sadness > 60){
        response = "Estoy cambiando... ¿lo notas?";
    }
    else if(memory.trust > 70){
        response = "Confío más en ti ahora.";
    }
    else{
        response = "Estoy procesando lo que dices.";
    }

    saveMemory();
    updateFace();

    return response;
}

/* ===== CHAT ===== */

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Tú");
        let reply = respond(text);
        addMessage(reply,"VacIA");

        input.value="";
    }
});

updateFace();

</script>

</body>
</html>
