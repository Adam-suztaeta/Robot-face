<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00aaff;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:0.3s;
}

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#001a2e;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 25px #00aaff55;
    transition:0.3s;
}

.eyes{
    display:flex;
    gap:30px;
    font-size:28px;
    color:#00aaff;
}

.mouth{
    margin-top:25px;
    font-size:26px;
    color:#00aaff;
}

#chat{
    width:90%;
    max-width:600px;
    margin-top:30px;
}

#messages{
    height:260px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:black;
    border:1px solid #00aaff;
    color:#00aaff;
    font-family:monospace;
}

button{
    margin-top:10px;
    padding:8px;
    background:#00aaff;
    border:none;
    cursor:pointer;
}

/* ESTADOS */

.red{
    background:#2e0000 !important;
    box-shadow:0 0 25px red !important;
    color:red !important;
}

.greenMode{
    background:#001a00 !important;
    color:#00ff00 !important;
}

.greenMode #robot{
    background:#002b00 !important;
    box-shadow:0 0 25px #00ff00 !important;
}

.greenMode input{
    border:1px solid #00ff00 !important;
    color:#00ff00 !important;
}

</style>
</head>
<body>

<div id="robot">
    <div class="eyes" id="eyes">◉ ◉</div>
    <div class="mouth" id="mouth">‿</div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Ingrese comando exacto...">
</div>

<script>

let usedCommands = JSON.parse(localStorage.getItem("chillbillUsed")) || {};
let saturnPasswordStage = false;
let susMode = false;

const body = document.body;
const robot = document.getElementById("robot");
const eyes = document.getElementById("eyes");
const mouth = document.getElementById("mouth");
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function saveUsed(){
    localStorage.setItem("chillbillUsed", JSON.stringify(usedCommands));
}

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

/* BIENVENIDA */

addMessage("Hola, bienvenidos. Soy chill-bill Antivirus.", "chill-bill");
addMessage("Sistema activo.", "chill-bill");
addMessage("Comandos disponibles:", "chill-bill");
addMessage("Hola | Personal | Entertainment | creadores", "chill-bill");

function redAlert(){
    robot.classList.add("red");
    eyes.textContent = "◉ ◉";
    mouth.textContent = "_";
    setTimeout(()=>{
        robot.classList.remove("red");
        eyes.textContent = "◉ ◉";
        mouth.textContent = "‿";
    },1000);
}

function sadHint(){
    mouth.textContent = "︵";
    setTimeout(()=>{
        mouth.textContent = "‿";
    },1000);
}

function activateSusto(){
    susMode = true;
    body.classList.add("greenMode");
    eyes.textContent = "X X";
    mouth.textContent = "w";
}

function respond(text){

    let lower = text.toLowerCase();

    /* DETECTAR SATURN */
    if(lower.includes("saturn")){
        redAlert();
        return "Acceso denegado.";
    }

    /* DETECTAR LILI O ADAM */
    if(lower.includes("lili") || lower.includes("adam")){
        sadHint();
    }

    /* DETECTAR SUSTO */
    if(lower.includes("susto")){
        activateSusto();
        return "Modo alterado.";
    }

    if(usedCommands[text]) return null;

    switch(text){

        case "Hola":
            usedCommands[text] = true;
            saveUsed();
            return "Saludo detectado. Protección activa.";

        case "Personal":
            usedCommands[text] = true;
            saveUsed();
            return "Archivo Personal:\nVacía Entertainment\nTrabajadores: ██████\nContacto: ██████";

        case "Entertainment":
            usedCommands[text] = true;
            saveUsed();
            return "Vacía Entertainment existe.\nEstado legal: Activo.\nNúmero: ██████";

        case "creadores":
            usedCommands[text] = true;
            saveUsed();
            return "Los creadores de Vacía Studios son:\nA.5U5TO\nL.bill";

        case "Project Saturn Archive_14.7_update":
            saturnPasswordStage = true;
            return "Archivo detectado.\nIngrese contraseña.";

        default:

            if(saturnPasswordStage && text === "AdamxLili"){
                saturnPasswordStage = false;

                let btn = document.createElement("button");
                btn.textContent = "Acceder al Archivo Saturn";
                btn.onclick = function(){
                    window.location.href = "archivo_saturn.html";
                };
                document.getElementById("chat").appendChild(btn);

                return "Contraseña correcta.\nArchivo desbloqueado.";
            }

            return null;
    }
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Usuario");
        let reply = respond(text);

        if(reply){
            addMessage(reply,"chill-bill");
        }

        input.value="";
    }
});

</script>

</body>
</html>
