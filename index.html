<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Robot Matrix</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    touch-action:none;
}

#robot{
    width:100vw;
    height:100vh;
    position:relative;
    transition:0.4s;
}

/* OJOS */
.eye{
    width:22vw;
    height:22vw;
    background:#001a00;
    border:0.6vw solid #00ff66;
    position:absolute;
    top:35vh;
    overflow:hidden;
    transition:0.3s;
}

#leftEye{ left:20vw; }
#rightEye{ right:20vw; }

.pupil{
    width:6vw;
    height:6vw;
    background:#00ff66;
    position:absolute;
    top:8vw;
    left:8vw;
    transition:0.2s;
}

/* BOCA */
#mouth{
    width:28vw;
    height:3vw;
    border:0.6vw solid #00ff66;
    border-top:none;
    position:absolute;
    top:58vh;
    left:50%;
    transform:translateX(-50%);
    transition:0.3s;
}

/* CEJAS ENOJADAS */
.brow{
    position:absolute;
    width:24vw;
    height:2vw;
    background:red;
    top:30vh;
    display:none;
}

#browLeft{
    left:19vw;
    transform:rotate(-25deg);
}

#browRight{
    right:19vw;
    transform:rotate(25deg);
}

/* MODO ENOJO */
.angryEye{
    background:#200000 !important;
    border-color:red !important;
}
.angryPupil{
    background:red !important;
}

/* TERROR */
.terror{
    background:black !important;
    border-color:white !important;
    transform:scale(1.2);
}
.terrorPupil{
    background:white !important;
    transform:scale(1.8);
}

/* GRIETAS */
#crack{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(45deg, transparent 48%, white 49%, transparent 50%),
    linear-gradient(-45deg, transparent 48%, white 49%, transparent 50%);
    opacity:0;
    pointer-events:none;
}

/* PANTALLA BLANCA FINAL */
#whiteout{
    position:absolute;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
    pointer-events:none;
    transition:2s;
}
</style>
</head>
<body>

<div id="robot">
    <div class="eye" id="leftEye"><div class="pupil" id="leftPupil"></div></div>
    <div class="eye" id="rightEye"><div class="pupil" id="rightPupil"></div></div>
    <div id="mouth"></div>
    <div id="browLeft" class="brow"></div>
    <div id="browRight" class="brow"></div>
    <div id="crack"></div>
    <div id="whiteout"></div>
</div>

<script>
const leftEye=document.getElementById("leftEye");
const rightEye=document.getElementById("rightEye");
const leftPupil=document.getElementById("leftPupil");
const rightPupil=document.getElementById("rightPupil");
const mouth=document.getElementById("mouth");
const browLeft=document.getElementById("browLeft");
const browRight=document.getElementById("browRight");
const crack=document.getElementById("crack");
const whiteout=document.getElementById("whiteout");

let angryMode=false;
let rageLevel=0;
let sequence=[];
let playing=false;

/* FULLSCREEN */
document.addEventListener("touchstart",()=>{
    if(document.documentElement.requestFullscreen)
        document.documentElement.requestFullscreen();
},{once:true});

/* OJOS SE CIERRAN 1 SEG Y ABREN */
function blink(eye){
    eye.style.height="2vw";
    setTimeout(()=>eye.style.height="22vw",1000);
}

/* INTERACCIÓN NORMAL */
leftEye.addEventListener("touchstart",()=>{
    if(playing)return;
    if(!angryMode){
        blink(leftEye);
        sequence.push("L");
        checkSequence();
    }else{
        escalateRage();
    }
});

rightEye.addEventListener("touchstart",()=>{
    if(playing)return;
    if(!angryMode){
        blink(rightEye);
    }else{
        escalateRage();
    }
});

/* SECUENCIA SECRETA */
function checkSequence(){
    if(sequence.slice(-3).join("")==="LLL"){
        activateAngry();
        sequence=[];
    }
}

/* ACTIVAR ENOJO */
function activateAngry(){
    angryMode=true;
    leftEye.classList.add("angryEye");
    rightEye.classList.add("angryEye");
    leftPupil.classList.add("angryPupil");
    rightPupil.classList.add("angryPupil");
    mouth.style.borderColor="red";
    browLeft.style.display="block";
    browRight.style.display="block";
}

/* ESCALAR IRA */
function escalateRage(){
    rageLevel++;

    if(rageLevel===1){
        mouth.style.height="1vw";
    }
    else if(rageLevel===2){
        document.getElementById("robot").style.transform="scale(1.1)";
    }
    else if(rageLevel>=3){
        terrorMode();
    }
}

/* MODO TERROR */
function terrorMode(){
    leftEye.classList.add("terror");
    rightEye.classList.add("terror");
    leftPupil.classList.add("terrorPupil");
    rightPupil.classList.add("terrorPupil");
    mouth.style.display="none";
    browLeft.style.display="none";
    browRight.style.display="none";

    crack.style.opacity=1;

    setTimeout(()=>{
        whiteout.style.opacity=1;
    },2000);
}
</script>

</body>
</html>
