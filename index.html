<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff88;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 25px #00ff8855;
}

.eyes{
    display:flex;
    gap:30px;
}

.eye{
    width:30px;
    height:30px;
    background:#00ff88;
    border-radius:50%;
}

.mouth{
    margin-top:25px;
    width:80px;
    height:20px;
    background:#00ff88;
    border-radius:10px;
}

#chat{
    width:90%;
    max-width:600px;
    margin-top:30px;
}

#messages{
    height:260px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
    font-size:14px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    font-family:monospace;
}

button{
    margin-top:10px;
    padding:8px;
    background:#00ff88;
    border:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="robot">
    <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>
    <div class="mouth"></div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Ingrese comando exacto...">
</div>

<script>

let usedCommands = JSON.parse(localStorage.getItem("chillbillUsed")) || {};
let saturnUnlocked = false;
let saturnPasswordStage = false;

const messages = document.getElementById("messages");
const input = document.getElementById("input");

function saveUsed(){
    localStorage.setItem("chillbillUsed", JSON.stringify(usedCommands));
}

function addMessage(text, sender){
    let div = document.createElement("div");
    div.textContent = sender + ": " + text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

/* MENSAJE DE BIENVENIDA */

addMessage("Hola, bienvenidos. Soy chill-bill Antivirus.", "chill-bill");
addMessage("Sistema activo.", "chill-bill");
addMessage("Comandos disponibles:", "chill-bill");
addMessage("Hola | Personal | Entertainment | creadores", "chill-bill");

function respond(text){

    if(usedCommands[text]) return null;

    switch(text){

        case "Hola":
            usedCommands[text] = true;
            saveUsed();
            return "Saludo detectado. Protección activa.";

        case "Personal":
            usedCommands[text] = true;
            saveUsed();
            return "Archivo Personal:\nVacía Entertainment\nTrabajadores: ██████\nContacto: ██████";

        case "Entertainment":
            usedCommands[text] = true;
            saveUsed();
            return "Vacía Entertainment existe.\nEstado legal: Activo.\nNúmero: ██████";

        case "creadores":
            usedCommands[text] = true;
            saveUsed();
            return "Los creadores de Vacía Studios son:\nA.5U5TO\nL.bill";

        case "Project Saturn Archive_14.7_update":
            saturnPasswordStage = true;
            return "Archivo detectado.\nIngrese contraseña.";

        default:
            if(saturnPasswordStage && text === "AdamandLily"){
                saturnUnlocked = true;
                saturnPasswordStage = false;

                let btn = document.createElement("button");
                btn.textContent = "Acceder al Archivo Saturn";
                btn.onclick = function(){
                    window.location.href = "archivo_saturn.html"; 
                    /* CAMBIÁ ESTA RUTA DESPUÉS */
                };
                document.getElementById("chat").appendChild(btn);

                return "Contraseña correcta.\nArchivo desbloqueado.";
            }

            return null;
    }
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let text = input.value.trim();
        if(!text) return;

        addMessage(text,"Usuario");
        let reply = respond(text);

        if(reply){
            addMessage(reply,"chill-bill");
        }

        input.value="";
    }
});

</script>

</body>
</html>
