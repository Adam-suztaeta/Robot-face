<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VacIA Terminal</title>

<style>
body{
    background:black;
    color:#00ff00;
    font-family:monospace;
    margin:0;
    text-align:center;
}

/* ROBOT */
#robot{
    margin-top:40px;
}

.face{
    width:120px;
    margin:auto;
}

.eyes{
    display:flex;
    justify-content:space-between;
    width:80px;
    margin:auto;
}

.eye{
    width:25px;
    height:25px;
    background:#00ff00;
}

.mouth{
    width:60px;
    height:10px;
    background:#00ff00;
    margin:10px auto 0 auto;
}

/* TERMINAL */
#terminal{
    width:80%;
    max-width:700px;
    margin:40px auto;
    text-align:left;
    border:1px solid #00ff00;
    padding:20px;
    min-height:200px;
}

#inputLine{
    display:flex;
}

#commandInput{
    background:black;
    border:none;
    color:#00ff00;
    font-family:monospace;
    font-size:16px;
    width:100%;
    outline:none;
}

/* BOTÓN SATURN */
#saturnAccess{
    display:none;
    margin-top:20px;
}

#saturnBtn{
    background:black;
    color:#00ff00;
    border:1px solid #00ff00;
    padding:10px 20px;
    font-family:monospace;
    cursor:pointer;
}

#saturnBtn:hover{
    background:#001100;
}
</style>
</head>
<body>

<div id="robot">
    <div class="face">
        <div class="eyes">
            <div class="eye" id="eyeL"></div>
            <div class="eye" id="eyeR"></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>
</div>

<div id="terminal"></div>

<div id="inputLine">
    <span>></span>
    <input type="text" id="commandInput" autofocus>
</div>

<div id="saturnAccess">
    <button id="saturnBtn">ABRIR ARCHIVO SATURN</button>
</div>

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("commandInput");
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");
const mouth = document.getElementById("mouth");

let typingSpeed = 25;

/* TYPEWRITER */
function typeWriter(text, callback){
    let i=0;
    function write(){
        if(i<text.length){
            terminal.innerHTML += text.charAt(i);
            i++;
            setTimeout(write, typingSpeed);
        } else {
            terminal.innerHTML += "<br>";
            if(callback) callback();
        }
    }
    write();
}

/* PARPADEO */
setInterval(()=>{
    eyeL.style.opacity="0";
    eyeR.style.opacity="0";
    setTimeout(()=>{
        eyeL.style.opacity="1";
        eyeR.style.opacity="1";
    },200);
},4000);

/* REACCIONES */

function reactSusto(){
    eyeL.innerHTML="✖";
    eyeR.innerHTML="✖";
    eyeL.style.display="flex";
    eyeR.style.display="flex";
    eyeL.style.alignItems="center";
    eyeR.style.alignItems="center";
    eyeL.style.justifyContent="center";
    eyeR.style.justifyContent="center";
    document.body.style.background="#001100";
    setTimeout(()=>{
        eyeL.innerHTML="";
        eyeR.innerHTML="";
        document.body.style.background="black";
    },1000);
}

function reactAdam(){
    mouth.style.height="4px";
    setTimeout(()=>{
        mouth.style.height="10px";
    },1000);
}

function reactLily(){
    document.body.style.background="#00bfff";
    mouth.style.height="4px";
    setTimeout(()=>{
        document.body.style.background="black";
        mouth.style.height="10px";
    },1000);
}

function reactViolet(){
    document.body.style.background="purple";
    typeWriter("###333###333###333###");
    setTimeout(()=>{
        location.reload();
    },1500);
}

/* PRESENTACIÓN */
typeWriter("Soy un antivirus especial creado por █████ I VACIA ESTUDIOS");
typeWriter("Sistema listo.");
typeWriter("Comandos disponibles:");
typeWriter("- help");
typeWriter("- clear");
typeWriter("- Project Saturn Archive_14.7_update");

/* INPUT */
input.addEventListener("keydown", function(e){
if(e.key==="Enter"){

    let cmd = input.value.trim();
    let lower = cmd.toLowerCase();

    terminal.innerHTML += "> "+cmd+"<br>";
    input.value="";

    /* PALABRAS CLAVE */

    if(lower.includes("susto")){
        reactSusto();
    }

    if(lower.includes("adam")){
        reactAdam();
    }

    if(lower.includes("lily")){
        reactLily();
    }

    if(lower.includes("violet") || lower.includes("baiolet")){
        reactViolet();
        return;
    }

    if(lower==="chau" || lower==="adiós"){
        history.back();
        return;
    }

    /* SATURN BLOQUEO */
    if(lower.includes("saturn") && lower !== "project saturn archive_14.7_update"){
        typeWriter("Acceso denegado.");
        return;
    }

    /* CONTRASEÑA EXACTA */
    if(lower==="project saturn archive_14.7_update"){
        typeWriter("Acceso concedido...");
        typeWriter("Desbloqueando archivo clasificado...");
        document.getElementById("saturnAccess").style.display="block";
        return;
    }

    if(lower==="help"){
        typeWriter("Comandos:");
        typeWriter("help / clear / Project Saturn Archive_14.7_update");
        return;
    }

    if(lower==="clear"){
        terminal.innerHTML="";
        return;
    }

    typeWriter("Comando no reconocido.");
}
});

/* BOTÓN SATURN */
document.getElementById("saturnBtn").addEventListener("click", function(){
    window.location.href="saturn.html";
});
</script>

</body>
</html>
