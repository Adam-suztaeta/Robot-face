<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>chill-bill Antivirus</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff00;
    font-family:"Courier New", monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TERMINAL */

#chat{
    width:80%;
    max-width:800px;
    background:black;
    border:2px solid #00ff00;
    padding:20px;
    margin-top:40px;
    box-shadow:0 0 20px #00ff0055;
}

#messages{
    min-height:300px;
    white-space:pre-wrap;
}

#input{
    width:100%;
    background:black;
    border:none;
    color:#00ff00;
    font-family:"Courier New", monospace;
    font-size:16px;
    outline:none;
}

/* ROBOT */

#robot{
    margin-top:40px;
    width:200px;
    height:200px;
    background:#111;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 20px #00ff0055;
    transition:0.3s;
}

#face{
    width:150px;
    height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.eyes{
    display:flex;
    gap:30px;
}

.eye{
    width:35px;
    height:35px;
    background:#00ff00;
}

.mouth{
    width:60px;
    height:12px;
    background:#00ff00;
    margin-top:-10px;
}

/* SUSTO */

.susto{
    background:#002b00 !important;
    box-shadow:0 0 30px #00ff00 !important;
}

.cross{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:22px;
    color:black;
}
</style>
</head>
<body>

<div id="robot">
    <div id="face">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>
</div>

<div id="chat">
    <div id="messages"></div>
    <input type="text" id="input" placeholder="C:\>">
</div>

<script>

let saturnPasswordStage = false;
let typing = false;

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const robot = document.getElementById("robot");
const eyes = document.querySelectorAll(".eye");

/* EFECTO ESCRITURA */

function typeText(text, speed = 20){
    return new Promise(resolve=>{
        typing = true;
        let i = 0;
        let line = document.createElement("div");
        messages.appendChild(line);

        function write(){
            if(i < text.length){
                line.textContent += text.charAt(i);
                i++;
                setTimeout(write, speed);
            }else{
                messages.appendChild(document.createElement("br"));
                typing = false;
                resolve();
            }
        }
        write();
        messages.scrollTop = messages.scrollHeight;
    });
}

/* PRESENTACIÓN INICIAL */

async function bootSequence(){
    await typeText("chill-bill Antivirus v2.1.0");
    await typeText("Inicializando sistema...");
    await typeText("Cargando modulos de proteccion...");
    await typeText("Escaneo de amenazas: COMPLETADO");
    await typeText("");
    await typeText("Soy un antivirus especial.");
    await typeText("Creado por ███████.");
    await typeText("Propiedad de I VACIA Studios.");
    await typeText("");
    await typeText("Comandos disponibles:");
    await typeText("Hola");
    await typeText("Personal");
    await typeText("Entertainment");
    await typeText("Creadores");
    await typeText("");
}

bootSequence();

/* SUSTO */

function activateSusto(){
    robot.classList.add("susto");
    eyes.forEach(e=>{
        e.textContent="X";
        e.classList.add("cross");
    });
    setTimeout(()=>{
        robot.classList.remove("susto");
        eyes.forEach(e=>{
            e.textContent="";
            e.classList.remove("cross");
        });
    },2000);
}

async function respond(text){

    let cleaned = text.trim();
    let lower = cleaned.toLowerCase();

    if(lower === "susto"){
        activateSusto();
        return;
    }

    if(lower === "project.saturn.archive_14.7_update"){
        saturnPasswordStage = true;
        await typeText("Archivo detectado.");
        await typeText("Ingrese contraseña.");
        return;
    }

    if(lower.includes("saturn") && lower !== "project.saturn.archive_14.7_update"){
        await typeText("Acceso denegado.");
        return;
    }

    if(saturnPasswordStage && lower === "adamandlily"){
        saturnPasswordStage = false;
        await typeText("Contraseña correcta.");
        await typeText("Archivo desbloqueado.");

        let btn = document.createElement("button");
        btn.textContent = "Acceder al Archivo Saturn";
        btn.style.background="black";
        btn.style.color="#00ff00";
        btn.style.border="1px solid #00ff00";
        btn.style.marginTop="10px";
        btn.onclick=function(){
            window.location.href="archivo_saturn.html";
        };
        document.getElementById("chat").appendChild(btn);
        return;
    }

    switch(lower){

        case "hola":
            await typeText("Saludo detectado. Hola! Bienvenido usuario.");
            break;

        case "personal":
            await typeText("Archivo_Personal:");
            await typeText("VACIA Entertainment");
            await typeText("Numero de trabajadores activos: ██████");
            break;

        case "entertainment":
            await typeText("VacIA Entertainment.");
            await typeText("Estado: Activo.");
            break;

        case "creadores":
            await typeText("Creadores registrados:");
            await typeText("A.5U5TO");
            await typeText("L.bill");
            break;

        default:
            await typeText("Comando no reconocido.");
    }
}

input.addEventListener("keypress", async function(e){
    if(e.key==="Enter" && !typing){
        let text=input.value.trim();
        if(!text) return;

        let userLine = document.createElement("div");
        userLine.textContent = "C:\\> " + text;
        messages.appendChild(userLine);

        input.value="";
        await respond(text);

        messages.scrollTop = messages.scrollHeight;
    }
});

</script>

</body>
</html>
